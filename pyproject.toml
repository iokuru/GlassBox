[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox"
version = "0.2.0"
description = "GlassBox + SiteDNA + CloneForge — failure-first agent runtime and site-to-React cloning system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
diff = [
    "scikit-image>=0.21.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
all = [
    "playwright>=1.40.0",
    "scikit-image>=0.21.0",
]

[project.scripts]
cloneforge = "apps.cloneforge:main"
glassbox-trace = "glassbox.observability.trace_server:run_trace_server"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["glassbox*", "sitedna*", "apps*", "eval*", "scenarios*"]
